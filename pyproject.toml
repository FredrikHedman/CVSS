[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvss"
version = "1.20.1"
description = "CVSS calculator for CVSS version 2.10"
readme = "README.rst"
license = "MIT"
authors = [
    { name = "Fredrik Hedman", email = "cvss@noruna.se" },
]
keywords = ["CVSS", "Common Vulnerability Scoring System", "IT-Security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = ["docopt"]

[project.urls]
Homepage = "https://github.com/FredrikHedman/CVSS"

[project.scripts]
cvss = "cvss.cvss:main"

[tool.hatch.build.targets.wheel]
packages = ["cvss"]

[tool.ruff]
line-length = 79
exclude = ["misc"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N"]
ignore = ["D100", "D101", "D102", "D103", "D301", "N803"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
