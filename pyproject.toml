[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvss"
version = "2.2.0"
description = "CVSS calculator for CVSS version 2.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Fredrik Hedman", email = "cvss@noruna.se" },
]
keywords = ["CVSS", "Common Vulnerability Scoring System", "IT-Security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/FredrikHedman/CVSS"

[project.scripts]
cvss = "cvss.cvss:main"
cvss4 = "cvss4.cvss:main"

[tool.hatch.build.targets.wheel]
packages = ["cvss", "cvss4"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["cvss", "cvss4", "tests"]

[tool.ruff]
line-length = 79
exclude = ["misc"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N"]
ignore = ["D100", "D101", "D102", "D103", "D301", "N803"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["cvss", "cvss4", "tests"]
exclude = ["misc"]
reportImplicitOverride = "warning"
reportImplicitStringConcatenation = "warning"
reportUnusedCallResult = "warning"
reportExplicitAny = "warning"
reportAny = "warning"
reportUnannotatedClassAttribute = "warning"

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
